<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings Room - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.17/locales-all.global.min.js'></script>
</head>
<div id="meetingModal" class="modal-event" style="display: none;">
    <div class="modal-event-content">
        <span class="modal-event-close-button" id="closeModal">&times;</span>
        <h2 id="modalTitle"></h2>
        <p><strong>Data:</strong> <span id="modalDate"></span></p>
        <p><strong>Ora:</strong> <span id="modalTime"></span></p>
        <p><strong>Stanza:</strong> <span id="modalRoom"></span></p>
        <p><strong>Descrizione:</strong> <span id="modalDescription"></span></p>
        <p><strong>Creato da:</strong> <span id="modalCreator"></span></p>

    </div>
</div>

<body>
    <div class="layout">
        <div class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="meeting.html">Meetings</a></li>
                <li><a href="rooms.html">Stanze</a></li>
                <li><a href="index.html" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="top-bar">
                <h1>Dashboard</h1>
            </div>
            <div class="mb-20">
                <label for="roomSelect">Seleziona stanza:</label>
                <select id="roomSelect"></select>
            </div>
            <div id="calendar" class="calendar-container"></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
